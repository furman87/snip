<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snip</title><link rel="stylesheet" href="/css/site.css"></head><body>
<section id="login" class="login"><div><span class="spark">✦</span><h1>snip</h1><p>Your private, cross-device scratchpad.</p><div id="providers" class="providers"></div><p id="login-note">Configure an OAuth provider to sign in.</p></div></section>
<div id="app" hidden><header><a class="brand" href="/">✦ snip</a><label class="search">⌕ <input id="search" placeholder="Search your snippets" type="search"></label><select id="sort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option><option value="title">Title A–Z</option></select><button id="new" class="primary">+ New snip</button><button id="logout" class="plain">Sign out</button></header><main><section id="empty" class="empty" hidden><span>▧</span><h1>Nothing here yet</h1><p>Paste text, code, Markdown, or a screenshot to save it for later.</p><button class="primary">Make your first snip</button></section><section id="grid" class="grid"></section></main></div>
<dialog id="editor"><form id="form"><div class="modal-head"><h2 id="editor-heading">New snip</h2><button type="button" class="close">×</button></div><input id="title" maxlength="200" placeholder="Title" required><p id="saved" hidden></p><div id="image-box" hidden><img id="image" alt="Pasted image"><button id="remove-image" type="button">Remove image</button></div><textarea id="content" placeholder="Paste or write something…" spellcheck="false"></textarea><div id="tabs" hidden><button type="button" data-tab="source" class="active">Source</button><button type="button" data-tab="preview">Markdown preview</button></div><article id="preview" hidden></article><footer><span id="error"></span><button class="close" type="button">Cancel</button><button class="primary" id="save">Save snip</button></footer></form></dialog>
<template id="card"><article class="card"><button class="open"><div class="meta"><span class="type"></span><time></time></div><h2></h2><div class="excerpt"></div></button><div class="actions"><button class="copy">Copy</button><button class="edit">Edit</button><button class="delete">Delete</button></div></article></template><script src="/js/site.js"></script></body></html>
