server {
    listen 80;
    listen [::]:80;
    server_name snip.fu87.app;

    # Let Certbot's HTTP challenge through, then require HTTPS for the app.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name snip.fu87.app;

    ssl_certificate /etc/letsencrypt/live/snip.fu87.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/snip.fu87.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Allows Snip's 10 MB image limit after JSON/Base64 overhead.
    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
